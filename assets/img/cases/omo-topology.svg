<rect width="1300" height="690" fill="#fff8ef"/>
<rect width="1300" height="690" fill="url(#dots)"/>
<text x="40" y="52" font-size="28" font-weight="900" fill="#1d1a2b">商場 OMO 平台：會員點數與行銷資料流</text>
<text x="40" y="80" font-size="16" fill="#5d5870">所有資料都進 CDP（單一事實來源），APP、POS、CRM 看到的點數和票券永遠一致</text>
<rect x="57" y="147" width="260" height="150" rx="20" fill="#1d1a2b"/><rect x="50" y="140" width="260" height="150" rx="20" fill="#4ea8ff" stroke="#1d1a2b" stroke-width="3"/><rect x="66" y="126" width="48" height="28" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="90.0" y="145" font-size="14" font-weight="700" fill="#1d1a2b" text-anchor="middle">線上</text><text x="180.0" y="192" font-size="26" font-weight="900" fill="#1d1a2b" text-anchor="middle">消費者 APP</text><text x="180.0" y="226" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">會員卡・點數錢包</text><text x="180.0" y="250" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">折價券票夾</text><rect x="57" y="497" width="260" height="150" rx="20" fill="#1d1a2b"/><rect x="50" y="490" width="260" height="150" rx="20" fill="#ffc93c" stroke="#1d1a2b" stroke-width="3"/><rect x="66" y="476" width="48" height="28" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="90.0" y="495" font-size="14" font-weight="700" fill="#1d1a2b" text-anchor="middle">線下</text><text x="180.0" y="542" font-size="26" font-weight="900" fill="#1d1a2b" text-anchor="middle">專櫃 POS</text><text x="180.0" y="576" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">結帳・點數折抵</text><text x="180.0" y="600" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">票券核銷</text><g transform="translate(7,7)"><path d="M520,230 L520,580 A120,30 0 0 0 760,580 L760,230 Z" fill="#1d1a2b"/></g><path d="M520,230 L520,580 A120,30 0 0 0 760,580 L760,230 Z" fill="#8b6cff" stroke="#1d1a2b" stroke-width="3"/><ellipse cx="640" cy="230" rx="120" ry="30" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="640" y="236" font-size="15" font-weight="700" fill="#1d1a2b" text-anchor="middle">單一事實來源 SSOT</text><text x="640" y="395.0" font-size="34" font-weight="900" fill="#1d1a2b" text-anchor="middle">CDP</text><text x="640" y="429.0" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">客戶數據平台</text><text x="640" y="453.0" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">會員 360° 標籤</text><rect x="977" y="327" width="270" height="170" rx="20" fill="#1d1a2b"/><rect x="970" y="320" width="270" height="170" rx="20" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="3"/><rect x="986" y="306" width="76" height="28" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="1024.0" y="325" font-size="14" font-weight="700" fill="#1d1a2b" text-anchor="middle">行銷引擎</text><text x="1105.0" y="372" font-size="26" font-weight="900" fill="#1d1a2b" text-anchor="middle">CRM</text><text x="1105.0" y="406" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">點數回饋規則</text><text x="1105.0" y="430" font-size="16" font-weight="500" fill="#1d1a2b" text-anchor="middle">自動派發折價券</text><path d="M180,300 L180,478" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="180" cy="385" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="180" y="390.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">1</text><text x="204" y="391" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">出示會員條碼</text><text x="204" y="413" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">核銷折價券</text><path d="M508,235 L322,235" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/><circle cx="344" cy="180" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="344" y="185.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">3</text><text x="368" y="186" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">點數、票券狀態</text><text x="368" y="208" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">即時同步</text><path d="M322,560 L508,560" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="344" cy="508" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="344" y="513.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">2</text><text x="368" y="514" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">交易與核銷數據</text><text x="368" y="536" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">即時上傳</text><text x="330" y="592" font-size="13.5" fill="#5d5870" stroke="#fff8ef" stroke-width="6" paint-order="stroke">經 API Gateway／中介層</text><text x="330" y="612" font-size="13.5" fill="#5d5870" stroke="#fff8ef" stroke-width="6" paint-order="stroke">舊 POS 免汰換</text><path d="M772,375 L958,375" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="794" cy="340" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="794" y="345.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">4</text><text x="818" y="346" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">會員標籤、分群</text><path d="M958,440 L772,440" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="794" cy="478" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="794" y="483.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">6</text><text x="818" y="484" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">回報活動成效</text><text x="818" y="506" font-size="13.5" fill="#5d5870" stroke="#fff8ef" stroke-width="6" paint-order="stroke">歷史資料同步與對帳</text><path d="M1105,308 L1105,112 L240,112 L240,128" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="600" cy="112" r="15" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="600" y="117.5" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">5</text><text x="624" y="118" font-size="16" font-weight="700" fill="#1d1a2b" text-anchor="start" stroke="#fff8ef" stroke-width="7" paint-order="stroke" stroke-linejoin="round">自動派發折價券、點數與推播</text></svg>