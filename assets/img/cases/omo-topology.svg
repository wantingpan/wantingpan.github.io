<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 690" width="1300" height="690" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d1a2b"/>
  </marker>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#1d1a2b" opacity=".12"/>
