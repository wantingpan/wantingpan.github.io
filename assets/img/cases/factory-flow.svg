<text x="40" y="52" font-size="28" font-weight="900" fill="#1d1a2b">智慧工廠：接單到出貨流程</text>
<text x="40" y="80" font-size="16" fill="#5d5870">原本的 Lotus Notes 流程改寫上線；每個關卡完成都會自動回寫全球樣品申請管理系統</text>
<rect x="55" y="155" width="160" height="78" rx="14" fill="#1d1a2b"/><rect x="50" y="150" width="160" height="78" rx="14" fill="#4ea8ff" stroke="#1d1a2b" stroke-width="3"/><text x="130.0" y="186.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">接單</text><text x="130.0" y="208.0" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="middle">由樣品系統轉入</text><rect x="265" y="155" width="150" height="78" rx="14" fill="#1d1a2b"/><rect x="260" y="150" width="150" height="78" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="335.0" y="195.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">設計審查</text><polygon points="535,139.0 620.0,194.0 535,249.0 450.0,194.0" fill="#1d1a2b"/><polygon points="530,134.0 615.0,189.0 530,244.0 445.0,189.0" fill="#ffc93c" stroke="#1d1a2b" stroke-width="3"/><text x="530" y="195.0" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">需要開模？</text><rect x="675" y="155" width="150" height="78" rx="14" fill="#1d1a2b"/><rect x="670" y="150" width="150" height="78" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="745.0" y="195.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">模具審查</text><polygon points="945,139.0 1030.0,194.0 945,249.0 860.0,194.0" fill="#1d1a2b"/><polygon points="940,134.0 1025.0,189.0 940,244.0 855.0,189.0" fill="#ffc93c" stroke="#1d1a2b" stroke-width="3"/><text x="940" y="195.0" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">模具費用？</text><rect x="1085" y="155" width="170" height="78" rx="14" fill="#1d1a2b"/><rect x="1080" y="150" width="170" height="78" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="1165.0" y="186.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">模具訂單確認</text><text x="1165.0" y="208.0" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="middle">客戶付費時</text><path d="M218,189.0 L250,189.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M418,189.0 L440,189.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M617,189.0 L660,189.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="638" y="177.0" font-size="14" font-weight="900" fill="#1d1a2b" text-anchor="middle" stroke="#fff8ef" stroke-width="6" paint-order="stroke">是</text><path d="M828,189.0 L850,189.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1027,189.0 L1070,189.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1048" y="177.0" font-size="14" font-weight="900" fill="#1d1a2b" text-anchor="middle" stroke="#fff8ef" stroke-width="6" paint-order="stroke">客戶</text><rect x="1085" y="365" width="170" height="78" rx="14" fill="#1d1a2b"/><rect x="1080" y="360" width="170" height="78" rx="14" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="3"/><text x="1165.0" y="396.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">模具製作</text><text x="1165.0" y="418.0" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="middle">寄開模通知給模具供應商</text><rect x="805" y="365" width="180" height="78" rx="14" fill="#1d1a2b"/><rect x="800" y="360" width="180" height="78" rx="14" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="3"/><text x="890.0" y="396.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">QA 寄送樣品</text><text x="890.0" y="418.0" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="middle">出貨</text><rect x="525" y="365" width="190" height="78" rx="14" fill="#1d1a2b"/><rect x="520" y="360" width="190" height="78" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="615.0" y="396.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">模具確認・訂單確認</text><text x="615.0" y="418.0" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="middle">客戶付費時</text><rect x="265" y="365" width="150" height="78" rx="14" fill="#1d1a2b"/><rect x="260" y="360" width="150" height="78" rx="14" fill="#ff6b5b" stroke="#1d1a2b" stroke-width="3"/><text x="335.0" y="405.0" font-size="16.5" font-weight="900" fill="#1d1a2b" text-anchor="middle">結案</text><path d="M1165,236 L1165,348" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1072,399.0 L990,399.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M792,399.0 L720,399.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M512,399.0 L420,399.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M940,244.0 L940,279.0 L1130,279.0 L1130,348" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1035" y="273.0" font-size="14" font-weight="900" fill="#1d1a2b" text-anchor="middle" stroke="#fff8ef" stroke-width="6" paint-order="stroke">公司自付</text><path d="M530,244.0 L530,309.0 L890,309.0 L890,348" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><text x="640" y="303.0" font-size="14" font-weight="900" fill="#1d1a2b" text-anchor="middle" stroke="#fff8ef" stroke-width="6" paint-order="stroke">否：不需開模，直接寄樣</text><rect x="50" y="500" width="760" height="270" rx="20" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="76" y="538" font-size="18" font-weight="900" fill="#1d1a2b" text-anchor="start">每個關卡的標準動作</text><rect x="76" y="562" width="54" height="40" rx="20" fill="#4ea8ff" stroke="#1d1a2b" stroke-width="2.5"/><text x="103.0" y="588" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">啟用</text><path d="M134,582 L154,582" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="160" y="562" width="118" height="40" rx="20" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="219.0" y="588" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">填寫必填資料</text><path d="M282,582 L302,582" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="308" y="562" width="118" height="40" rx="20" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/><text x="367.0" y="588" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">開立開模請購</text><path d="M430,582 L450,582" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="456" y="562" width="102" height="40" rx="20" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="2.5"/><text x="507.0" y="588" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">寄開模通知</text><path d="M562,582 L582,582" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="588" y="562" width="54" height="40" rx="20" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="2.5"/><text x="615.0" y="588" font-size="15" font-weight="900" fill="#1d1a2b" text-anchor="middle">完成</text><text x="76" y="640" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">・可隨時「儲存」草稿，資料不齊可「退回」上一關</text><text x="76" y="670" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">・兩套系統的關卡負責人分開設定，各關卡都有必填資料檢查</text><text x="76" y="700" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">・開模時自動寄信給模具供應商，並記錄模具資訊</text><text x="76" y="730" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">・每個動作完成後，狀態與資料即時同步回樣品系統</text><rect x="840" y="500" width="410" height="270" rx="20" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="2.5"/><text x="866" y="538" font-size="18" font-weight="900" fill="#1d1a2b" text-anchor="start">工廠 E 化成果</text><rect x="866" y="570" width="358" height="52" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="884" y="593" font-size="15.5" font-weight="900" fill="#1d1a2b" text-anchor="start">點檢系統</text><text x="884" y="612" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="start">現場點檢不再靠紙本</text><rect x="866" y="634" width="358" height="52" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="884" y="657" font-size="15.5" font-weight="900" fill="#1d1a2b" text-anchor="start">放行單（海關通行）</text><text x="884" y="676" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="start">出廠單據線上製作</text><rect x="866" y="698" width="358" height="52" rx="14" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="884" y="721" font-size="15.5" font-weight="900" fill="#1d1a2b" text-anchor="start">訂單狀態自動同步</text><text x="884" y="740" font-size="13" font-weight="500" fill="#1d1a2b" text-anchor="start">業務即時看到工廠進度</text></svg>