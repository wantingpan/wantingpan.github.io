人</text><rect x="675" y="623" width="200" height="78" rx="16" fill="#1d1a2b"/><rect x="670" y="618" width="200" height="78" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="770.0" y="664.0" font-size="17" font-weight="900" fill="#1d1a2b" text-anchor="middle">工廠財務</text><rect x="975" y="623" width="200" height="78" rx="16" fill="#1d1a2b"/><rect x="970" y="618" width="200" height="78" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="3"/><text x="1070.0" y="664.0" font-size="17" font-weight="900" fill="#1d1a2b" text-anchor="middle">生產排程</text><path d="M278,657.0 L358,657.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M578,657.0 L658,657.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M878,657.0 L958,657.0" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M154.0,462 L154.0,606" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#ah)"/><text x="168.0" y="515" font-size="14" font-weight="700" fill="#1d1a2b" text-anchor="start">設計審查完成後，</text><text x="168.0" y="535" font-size="14" font-weight="700" fill="#1d1a2b" text-anchor="start">需要量產就啟動 SKU 流程</text><rect x="40" y="765" width="1220" height="70" rx="18" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="64" y="795" font-size="16" font-weight="900" fill="#1d1a2b" text-anchor="start">系統自動判斷走哪一條流程：</text><text x="64" y="820" font-size="14.5" font-weight="500" fill="#1d1a2b" text-anchor="start">依「是否建立 SKU、是否需要樣品、是否需要開模」組合出不同路徑；審核不通過可退回上一關，預計日期或數量變更也會通知相關角色</text></svg>