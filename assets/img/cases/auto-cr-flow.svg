h d="M598,445 C640,445 640,445 667,445" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="675" y="508" width="200" height="44" rx="22" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="775" y="536" font-size="16" font-weight="900" fill="#1d1a2b" text-anchor="middle">調整需求</text><path d="M598,445 C640,445 640,530 667,530" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="910" y="388" width="330" height="114" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="2.5"/><text x="930" y="422" font-size="15.5" font-weight="900" fill="#1d1a2b" text-anchor="start">暫緩或調整需求時：</text><text x="930" y="450" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">影響專案本身時程與其他項目，</text><text x="930" y="476" font-size="15" font-weight="500" fill="#1d1a2b" text-anchor="start">需要重新排程並和客戶確認取捨</text><path d="M883,360 C895,360 895,420 902,420" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M883,530 C895,530 895,470 902,470" fill="none" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/></svg>