<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Bricolage Grotesque','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1d1a2b" opacity="0.16"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="#4ea8ff"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- Decorative shapes -->
  <circle cx="720" cy="70" r="90" fill="#ffc93c" stroke="#1d1a2b" stroke-width="4"/>
  <circle cx="70" cy="390" r="65" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="4"/>

  <!-- Browser Window Shadow & Frame -->
  <rect x="78" y="48" width="656" height="364" rx="20" fill="#1d1a2b"/>
  <rect x="70" y="40" width="656" height="364" rx="20" fill="#fff8ef" stroke="#1d1a2b" stroke-width="4"/>

  <!-- Browser Top Bar -->
  <path d="M70,60 Q70,40 90,40 L706,40 Q726,40 726,60 L726,88 L70,88 Z" fill="#fdeedd" stroke="#1d1a2b" stroke-width="4"/>
  <circle cx="102" cy="64" r="8" fill="#ff6b5b" stroke="#1d1a2b" stroke-width="2.5"/>
  <circle cx="126" cy="64" r="8" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/>
  <circle cx="150" cy="64" r="8" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="2.5"/>

  <!-- URL Bar -->
  <rect x="180" y="50" width="380" height="28" rx="14" fill="#ffffff" stroke="#1d1a2b" stroke-width="2.5"/>
  <text x="370" y="69" font-size="13" font-weight="700" fill="#5d5870" text-anchor="middle">wantingpan.github.io/dev-intel-hub</text>

  <!-- Language Pill -->
  <rect x="626" y="50" width="76" height="28" rx="14" fill="#8b6cff" stroke="#1d1a2b" stroke-width="2.5"/>
  <text x="664" y="69" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">中 / EN</text>

  <!-- Header Section -->
  <rect x="102" y="110" width="108" height="26" rx="13" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2.5"/>
  <text x="156" y="128" font-size="13" font-weight="800" fill="#1d1a2b" text-anchor="middle">DAILY BRIEF</text>
  <text x="102" y="172" font-size="30" font-weight="900" fill="#1d1a2b">軟體人每日情報 DevBrief Daily</text>
  <text x="102" y="198" font-size="15" font-weight="600" fill="#5d5870">5 分鐘掌握 AI・語言框架・雲端 DevOps・資安漏洞與 EOL</text>

  <!-- 3 Feature Cards -->
  <!-- Card 1: Action Required -->
  <rect x="106" y="222" width="184" height="154" rx="14" fill="#1d1a2b"/>
  <rect x="102" y="218" width="184" height="154" rx="14" fill="#ffffff" stroke="#1d1a2b" stroke-width="3"/>
  <rect x="116" y="232" width="96" height="24" rx="12" fill="#ff6b5b" stroke="#1d1a2b" stroke-width="2"/>
  <text x="164" y="248" font-size="12" font-weight="800" fill="#1d1a2b" text-anchor="middle">需要行動清單</text>
  <text x="116" y="280" font-size="15" font-weight="800" fill="#1d1a2b">CISA &amp; GitHub 漏洞</text>
  <text x="116" y="302" font-size="13" font-weight="500" fill="#5d5870">直接列出已遭利用</text>
  <text x="116" y="322" font-size="13" font-weight="500" fill="#5d5870">與需修補套件版本</text>
  <rect x="116" y="338" width="66" height="20" rx="6" fill="#fdeedd"/>
  <text x="149" y="352" font-size="11" font-weight="800" fill="#1d1a2b" text-anchor="middle">CVE / KEV</text>

  <!-- Card 2: EOL Tracker -->
  <rect x="310" y="222" width="184" height="154" rx="14" fill="#1d1a2b"/>
  <rect x="306" y="218" width="184" height="154" rx="14" fill="#ffffff" stroke="#1d1a2b" stroke-width="3"/>
  <rect x="320" y="232" width="96" height="24" rx="12" fill="#3ccf9e" stroke="#1d1a2b" stroke-width="2"/>
  <text x="368" y="248" font-size="12" font-weight="800" fill="#1d1a2b" text-anchor="middle">版本支援期限</text>
  <text x="320" y="280" font-size="15" font-weight="800" fill="#1d1a2b">14 項技術 EOL 追蹤</text>
  <text x="320" y="302" font-size="13" font-weight="500" fill="#5d5870">.NET・Node・Python</text>
  <text x="320" y="322" font-size="13" font-weight="500" fill="#5d5870">React・Angular 等</text>
  <rect x="320" y="338" width="76" height="20" rx="6" fill="#fdeedd"/>
  <text x="358" y="352" font-size="11" font-weight="800" fill="#1d1a2b" text-anchor="middle">EOL Radar</text>

  <!-- Card 3: Event Impact -->
  <rect x="514" y="222" width="184" height="154" rx="14" fill="#1d1a2b"/>
  <rect x="510" y="218" width="184" height="154" rx="14" fill="#ffffff" stroke="#1d1a2b" stroke-width="3"/>
  <rect x="524" y="232" width="96" height="24" rx="12" fill="#ffc93c" stroke="#1d1a2b" stroke-width="2"/>
  <text x="572" y="248" font-size="12" font-weight="800" fill="#1d1a2b" text-anchor="middle">事件影響拆解</text>
  <text x="524" y="280" font-size="15" font-weight="800" fill="#1d1a2b">發生 → 影響 → 該做</text>
  <text x="524" y="302" font-size="13" font-weight="500" fill="#5d5870">白話名詞小教室</text>
  <text x="524" y="322" font-size="13" font-weight="500" fill="#5d5870">跨職能溝通零落差</text>
  <rect x="524" y="338" width="82" height="20" rx="6" fill="#fdeedd"/>
  <text x="565" y="352" font-size="11" font-weight="800" fill="#1d1a2b" text-anchor="middle">AI &amp; DevOps</text>
</svg>
