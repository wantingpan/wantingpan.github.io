<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>作品集</title>
  <meta name="description" content="個人作品集">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>

  <header class="nav">
    <a class="brand" href="#top"><span class="avatar avatar--sm" data-avatar></span><span data-handle></span></a>
    <nav class="nav__links">
      <a href="#cases">案例</a>
      <a href="#projects">專案</a>
      <a href="#side" class="nav__more">Side Projects</a>
      <a href="#skills" class="nav__more">技能</a>
      <a href="#story">經歷</a>
      <a href="#contact">合作</a>
      <button class="theme-btn" type="button" aria-label="切換深淺色" data-theme-toggle>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="hero" id="top">
      <div class="blob blob--1" aria-hidden="true"></div>
      <div class="blob blob--2" aria-hidden="true"></div>
      <div class="blob blob--3" aria-hidden="true"></div>
      <div class="wrap hero__inner">
        <div class="hero__meta reveal">
          <span class="avatar avatar--lg" data-avatar></span>
          <span class="pill"><span class="dot"></span><span data-location></span> · <span data-role></span></span>
        </div>
        <p class="hero__name reveal" data-name></p>
        <h1 class="hero__title reveal" data-headline></h1>
        <p class="hero__bio reveal" data-bio></p>
        <div class="hero__cta reveal">
          <a class="btn btn--primary" href="#cases">看精選案例</a>
          <a class="btn" href="#projects">全部專案（<span data-count></span>）</a>
          <a class="btn btn--ghost" data-resume target="_blank" rel="noopener">完整履歷 ↗</a>
        </div>
        <dl class="stats reveal" data-stats></dl>
      </div>
      <div class="marquee" aria-label="技能">
        <div class="marquee__track" data-skills></div>
      </div>
    </section>

    <!-- Case studies -->
    <section class="section" id="cases">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="精選案例"></span>
          <h2>深入看幾個專案</h2>
          <p class="section__lead">從背景、遇到的問題，到我怎麼分析、設計與推動。</p>
        </div>
        <div class="cases" data-cases></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="section" id="projects">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="專案經歷"></span>
          <h2>做過的專案</h2>
          <p class="section__lead">2012 年至今參與的工作專案，可以依產業篩選。</p>
        </div>
        <div class="chips reveal" role="tablist" aria-label="作品分類" data-chips></div>
        <div class="grid" data-grid></div>
      </div>
    </section>

    <!-- Side projects -->
    <section class="section" id="side">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="Side Projects"></span>
          <h2>下班後的小作品</h2>
          <p class="section__lead">工作以外，有靈感就動手做的東西。</p>
        </div>
        <div class="grid" data-side></div>
      </div>
    </section>

    <!-- Skills -->
    <section class="section" id="skills">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="技能"></span>
          <h2>工具箱</h2>
        </div>
        <div class="skills" data-skill-groups></div>
      </div>
    </section>

    <!-- Story -->
    <section class="section" id="story">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="經歷"></span>
          <h2>一路走來</h2>
        </div>
        <ol class="timeline" data-story></ol>

        <div class="wip reveal">
          <h3 data-hl-title></h3>
          <ul data-wip></ul>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="wrap">
        <div class="section__head reveal">
          <span class="kicker" data-kicker="一起合作"></span>
          <h2>我能帶來什麼</h2>
        </div>
        <div class="values" data-values></div>

        <div class="contact reveal">
          <span class="status" data-status><span class="dot"></span><span data-status-text></span></span>
          <h2 data-contact-headline></h2>
          <p data-contact-text></p>
          <dl class="prefs" data-prefs></dl>
          <div class="hero__cta" data-contact></div>
          <p class="contact__note" data-response></p>
        </div>
      </div>
    </section>
  </main>

  <a class="fab" href="#contact" data-fab>聯絡我</a>
  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>© <span data-year></span> <span data-name></span> · <span data-location></span></span>
      <a href="#top">回到頂端 ↑</a>
    </div>
  </footer>

  <dialog class="lightbox" data-lightbox>
    <button class="lightbox__close" type="button" aria-label="關閉" data-lightbox-close>✕</button>
    <img alt="" data-lightbox-img>
    <p data-lightbox-cap></p>
  </dialog>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
